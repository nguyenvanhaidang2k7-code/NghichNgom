<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn đặt - TripWeave AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== THANH HEADER CHUNG ========== -->
  <header class="topbar">
    <a class="brand" href="../partner-overview/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f2a4a" stroke-width="2"><path d="M12 4 21 19 H3 Z"/></svg>
      TripWeave AI
    </a>
    <div class="topbar-search">🔍<input id="global-search" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động..."></div>
    <button class="icon-btn" id="bell-btn" title="Thông báo">🔔</button>
    <button class="avatar" id="avatar-btn" title="Tài khoản">Đ</button>
  </header>

  <div class="layout">
    <!-- ========== SIDEBAR VAI TRÒ: ĐỐI TÁC ĐỊA PHƯƠNG ========== -->
    <aside class="sidebar">
      <a href="../partner-overview/index.html">Tổng quan</a>
      <a href="../partner-activity-management/index.html">Trải nghiệm</a>
      <a href="index.html" class="active">Đơn đặt</a>
      <a href="../partner-reviews/index.html">Đánh giá</a>
      <a href="../partner-revenue/index.html">Doanh thu</a>
      <a href="../partner-profile/index.html">Hồ sơ</a>
      <div class="sidebar-footer">Đối tác địa phương</div>
    </aside>

    <main class="content">
      <!-- Thanh công cụ: tìm theo tên khách + chip lọc trạng thái đơn -->
      <div class="card">
        <div class="toolbar">
          <div class="field grow">
            <label for="search-input">Tìm đơn đặt</label>
            <div class="search-box">🔍<input id="search-input" placeholder="Tìm theo tên khách..."></div>
          </div>
          <div class="chip-row" id="chip-row">
            <button class="chip active" data-loc="tatca">Tất cả</button>
            <button class="chip" data-loc="cho">Chờ xác nhận</button>
            <button class="chip" data-loc="xacnhan">Đã xác nhận</button>
            <button class="chip" data-loc="hoanthanh">Đã hoàn thành</button>
          </div>
        </div>
      </div>

      <!-- Danh sách đơn: JS render (skeleton / hàng / rỗng) -->
      <div id="danh-sach"></div>
    </main>
  </div>

  <!-- ========== MODAL XEM CHI TIẾT ĐƠN (READ) ========== -->
  <div class="modal-overlay" id="modal-chi-tiet">
    <div class="modal">
      <h3>Chi tiết đơn đặt</h3>
      <dl class="detail">
        <dt>Khách hàng</dt><dd id="ct-khach"></dd>
        <dt>Số điện thoại</dt><dd id="ct-sdt"></dd>
        <dt>Trải nghiệm</dt><dd id="ct-tn"></dd>
        <dt>Số lượng</dt><dd id="ct-so"></dd>
        <dt>Ngày đặt</dt><dd id="ct-ngay"></dd>
        <dt>Tổng tiền</dt><dd id="ct-tong"></dd>
        <dt>Trạng thái</dt><dd id="ct-trang-thai"></dd>
        <dt>Ghi chú</dt><dd id="ct-ghi-chu"></dd>
      </dl>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="ct-dong" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL CẬP NHẬT TRẠNG THÁI ĐƠN (UPDATE) ========== -->
  <div class="modal-overlay" id="modal-cap-nhat">
    <div class="modal modal-sm">
      <h3>Cập nhật đơn đặt</h3>
      <form id="form-cap-nhat" class="form-stack" novalidate>
        <div class="field"><label for="cn-trang-thai">Trạng thái mới</label>
          <select id="cn-trang-thai">
            <option value="cho">Chờ xác nhận</option>
            <option value="xacnhan">Đã xác nhận</option>
            <option value="hoanthanh">Đã hoàn thành</option>
            <option value="huy">Đã hủy</option>
          </select>
        </div>
        <div class="field"><label for="cn-ghi-chu">Ghi chú cho khách</label>
          <textarea id="cn-ghi-chu" rows="3" placeholder="Ví dụ: Đã gọi xác nhận với khách..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cn-huy">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-box"></div>
  <script src="script.js"></script>
</body>
</html>

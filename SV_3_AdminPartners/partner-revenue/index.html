<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doanh thu - TripWeave AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== THANH HEADER CHUNG ========== -->
  <header class="topbar">
    <a class="brand" href="../partner-overview/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f2a4a" stroke-width="2"><path d="M12 4 21 19 H3 Z"/></svg>
      TripWeave AI
    </a>
    <div class="topbar-search">🔍<input id="global-search" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động..."></div>
    <button class="icon-btn" id="bell-btn" title="Thông báo">🔔</button>
    <button class="avatar" id="avatar-btn" title="Tài khoản">Đ</button>
  </header>

  <div class="layout">
    <!-- ========== SIDEBAR VAI TRÒ: ĐỐI TÁC ĐỊA PHƯƠNG ========== -->
    <aside class="sidebar">
      <a href="../partner-overview/index.html">Tổng quan</a>
      <a href="../partner-activity-management/index.html">Trải nghiệm</a>
      <a href="../partner-orders/index.html">Đơn đặt</a>
      <a href="../partner-reviews/index.html">Đánh giá</a>
      <a href="index.html" class="active">Doanh thu</a>
      <a href="../partner-profile/index.html">Hồ sơ</a>
      <div class="sidebar-footer">Đối tác địa phương</div>
    </aside>

    <main class="content">
      <!-- 4 THẺ THỐNG KÊ (điền số từ LocalStorage bằng JS) -->
      <section class="stats">
        <div class="card">
          <p class="stat-label">Doanh thu tháng</p>
          <p class="stat-value primary" id="stat-doanh-thu">...</p>
        </div>
        <div class="card">
          <p class="stat-label">Đơn hoàn thành</p>
          <p class="stat-value success" id="stat-don">...</p>
        </div>
        <div class="card">
          <p class="stat-label">Đánh giá TB</p>
          <p class="stat-value info" id="stat-sao">...</p>
        </div>
        <div class="card">
          <p class="stat-label">Tăng trưởng</p>
          <p class="stat-value warning" id="stat-tang">...</p>
          <p class="stat-sub">so với tháng trước</p>
        </div>
      </section>

      <div class="grid-2">
        <!-- BIỂU ĐỒ CỘT: doanh thu 6 tháng (vẽ bằng CSS thuần) -->
        <div class="card">
          <div class="card-head">
            <h3>Biểu đồ doanh thu theo tháng (triệu ₫)</h3>
            <button class="btn btn-secondary" id="btn-lam-moi" type="button">Làm mới số liệu</button>
          </div>
          <div class="chart" id="chart"></div>
        </div>
        <div class="side-col">
          <!-- Thẻ tăng trưởng nổi bật -->
          <div class="card growth-card">
            <p class="stat-label">Tăng trưởng</p>
            <p class="growth-value" id="growth-value">...</p>
            <p class="stat-sub">so với tháng trước</p>
          </div>
          <!-- TOP DỊCH VỤ: thanh tiến trình theo % -->
          <div class="card">
            <h3>Top dịch vụ</h3>
            <div id="top-dich-vu" class="top-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-box"></div>
  <script src="script.js"></script>
</body>
</html>

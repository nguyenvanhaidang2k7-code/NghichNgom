<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm duyệt nội dung - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', background: '#F8FAFC' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body class="bg-background text-gray-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-primary text-white flex flex-col hidden md:flex h-full shrink-0">
        <div class="p-4 flex items-center gap-3 font-bold text-xl border-b border-secondary">
            <i class="fa-solid fa-earth-asia text-accent"></i> TripWeave AI
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav"></nav>
    </aside>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-4"><button class="md:hidden text-gray-500"><i class="fa-solid fa-bars"></i></button></div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer group relative" id="user-menu-btn">
                    <img id="topbar-user-avatar" src="" class="w-9 h-9 rounded-full">
                    <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg hidden z-50" id="user-dropdown">
                        <button onclick="Auth.logout()" class="w-full text-left px-3 py-2 text-sm text-red-600">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6 bg-background relative" id="main-content">
            <div class="max-w-6xl mx-auto space-y-4">
                <h1 class="text-2xl font-bold text-gray-900 mb-6">Kiểm duyệt Nội dung</h1>
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                <th class="px-6 py-4 font-medium">Nội dung</th>
                                <th class="px-6 py-4 font-medium">Người đăng</th>
                                <th class="px-6 py-4 font-medium">Loại</th>
                                <th class="px-6 py-4 font-medium text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm" id="moderation-table">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = MockDB.get();
            const tbody = document.getElementById('moderation-table');
            
            // Combine trips and experiences
            let items = [];
            db.trips.forEach(t => {
                const user = db.users.find(u => u.id === t.userId);
                items.push({ id: t.id, type: 'trip', title: t.title, user: user ? user.name : 'Unknown', status: t.status });
            });
            db.experiences.forEach(e => {
                items.push({ id: e.id, type: 'experience', title: e.title, user: 'Partner', status: e.status });
            });

            // Filter for pending items
            items = items.filter(i => i.status === 'pending');

            if(items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Không có nội dung nào chờ duyệt.</td></tr>';
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                const typeBadge = item.type === 'trip' ? '<span class="px-2 py-1 bg-purple-50 text-purple-600 text-xs font-medium rounded-full">Lịch trình</span>' : '<span class="px-2 py-1 bg-orange-50 text-orange-600 text-xs font-medium rounded-full">Trải nghiệm</span>';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-900">${item.title}</td>
                    <td class="px-6 py-4 text-gray-600">${item.user}</td>
                    <td class="px-6 py-4">${typeBadge}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="approveItem('${item.id}', '${item.type}')" class="px-2 py-1 bg-accent hover:bg-blue-700 text-white rounded text-xs mr-2 transition">Duyệt</button>
                        <button onclick="rejectItem('${item.id}', '${item.type}')" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-xs transition">Từ chối</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.approveItem = function(id, type) {
            if(type === 'trip') MockDB.updateTripStatus(id, 'approved');
            else {
                const db = MockDB.get();
                const item = db.experiences.find(e => e.id === id);
                if(item) { item.status = 'approved'; MockDB.save(db); }
            }
            window.location.reload();
        }

        window.rejectItem = function(id, type) {
            if(type === 'trip') MockDB.updateTripStatus(id, 'rejected');
            else {
                const db = MockDB.get();
                const item = db.experiences.find(e => e.id === id);
                if(item) { item.status = 'rejected'; MockDB.save(db); }
            }
            window.location.reload();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', success: '#10B981', warning: '#F97316', purple: '#8B5CF6', background: '#F8FAFC' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body class="bg-background text-gray-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-primary text-white flex flex-col hidden md:flex h-full shrink-0">
        <div class="p-4 flex items-center gap-3 font-bold text-xl border-b border-secondary">
            <i class="fa-solid fa-earth-asia text-accent"></i> TripWeave AI
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav"></nav>
    </aside>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-4"><button class="md:hidden text-gray-500"><i class="fa-solid fa-bars"></i></button></div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer group relative" id="user-menu-btn">
                    <img id="topbar-user-avatar" src="" class="w-9 h-9 rounded-full">
                    <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg hidden z-50" id="user-dropdown">
                        <button onclick="Auth.logout()" class="w-full text-left px-3 py-2 text-sm text-red-600">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6 bg-background relative" id="main-content">
            <div class="max-w-6xl mx-auto space-y-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Tổng quan Hệ thống</h1>
                    <p class="text-gray-500 text-sm">Giám sát hoạt động và dữ liệu trên toàn nền tảng.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 bg-blue-50 text-accent rounded-lg flex items-center justify-center"><i class="fa-solid fa-users"></i></div>
                            <span class="text-xs font-semibold text-green-500 bg-green-50 px-2 py-1 rounded">+12%</span>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-gray-900">12,450</div>
                            <div class="text-sm text-gray-500 font-medium">Tổng người dùng</div>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                            <span class="text-xs font-semibold text-green-500 bg-green-50 px-2 py-1 rounded">+8%</span>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-gray-900">8,234</div>
                            <div class="text-sm text-gray-500 font-medium">Lịch trình AI tạo</div>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 bg-green-50 text-success rounded-lg flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-gray-900">1,204</div>
                            <div class="text-sm text-gray-500 font-medium">Tổng địa điểm & Dịch vụ</div>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-2 h-full bg-warning"></div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 bg-orange-50 text-warning rounded-lg flex items-center justify-center"><i class="fa-solid fa-shield-halved"></i></div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-gray-900">15</div>
                            <div class="text-sm text-gray-500 font-medium">Nội dung chờ duyệt</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

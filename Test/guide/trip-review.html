<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Review - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', success: '#10B981', warning: '#F97316', background: '#F8FAFC' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body class="bg-background text-gray-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-primary text-white flex flex-col hidden md:flex h-full shrink-0">
        <div class="p-4 flex items-center gap-3 font-bold text-xl border-b border-secondary">
            <i class="fa-solid fa-earth-asia text-accent"></i> TripWeave AI
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav"></nav>
    </aside>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-4"><button class="md:hidden text-gray-500"><i class="fa-solid fa-bars"></i></button></div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer group relative" id="user-menu-btn">
                    <img id="topbar-user-avatar" src="" class="w-9 h-9 rounded-full">
                    <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg hidden z-50" id="user-dropdown">
                        <button onclick="Auth.logout()" class="w-full text-left px-3 py-2 text-sm text-red-600">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6 bg-background relative" id="main-content">
            <div class="max-w-6xl mx-auto">
                <div class="mb-6 flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 mb-1">Yêu cầu Review Lịch trình</h1>
                        <p class="text-sm text-gray-500">Danh sách các lịch trình AI cần bạn đánh giá và điều chỉnh chuyên môn.</p>
                    </div>
                    <div class="flex gap-2">
                        <select class="px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none bg-white">
                            <option>Tất cả trạng thái</option>
                            <option>Chờ duyệt</option>
                            <option>Đã duyệt</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                <th class="px-6 py-4 font-medium">Khách hàng</th>
                                <th class="px-6 py-4 font-medium">Tên lịch trình</th>
                                <th class="px-6 py-4 font-medium">Thời lượng</th>
                                <th class="px-6 py-4 font-medium">Trạng thái</th>
                                <th class="px-6 py-4 font-medium">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm" id="review-table-body">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = MockDB.get();
            const tbody = document.getElementById('review-table-body');
            
            // Only show trips that are pending or were reviewed (we can show all for demo, or filter by status)
            const trips = db.trips;
            
            if (trips.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-500">Không có yêu cầu review nào.</td></tr>';
                return;
            }

            trips.forEach(trip => {
                const user = db.users.find(u => u.id === trip.userId) || {name: 'Khách', avatar: ''};
                
                let badgeClass = 'bg-orange-50 text-warning border-orange-100';
                let badgeText = 'Chờ review';
                if(trip.status === 'approved') { badgeClass = 'bg-green-50 text-success border-green-100'; badgeText = 'Đã duyệt'; }
                if(trip.status === 'rejected') { badgeClass = 'bg-red-50 text-danger border-red-100'; badgeText = 'Từ chối'; }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${user.avatar}" class="w-8 h-8 rounded-full">
                            <div>
                                <div class="font-medium text-gray-900">${user.name}</div>
                                <div class="text-xs text-gray-500">${trip.createdAt.split('T')[0]}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 font-medium text-gray-800">${trip.title}</td>
                    <td class="px-6 py-4 text-gray-600">${trip.days} Ngày</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 ${badgeClass} text-xs font-semibold rounded-full border">${badgeText}</span></td>
                    <td class="px-6 py-4">
                        <a href="trip-detail-review.html?id=${trip.id}" class="inline-flex items-center gap-1 px-3 py-1.5 ${trip.status === 'pending' ? 'bg-accent text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} rounded-md transition font-medium text-xs shadow-sm">
                            ${trip.status === 'pending' ? '<i class="fa-solid fa-eye"></i> Xem xét' : 'Chi tiết'}
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>

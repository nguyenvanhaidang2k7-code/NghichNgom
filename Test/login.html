<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', background: '#F8FAFC' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/js/auth.js"></script>
</head>
<body class="bg-background flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2"><i class="fa-solid fa-earth-asia text-accent mr-2"></i>TripWeave AI</h1>
            <p class="text-gray-500 text-sm">Nền tảng du lịch thông minh</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent outline-none transition" placeholder="Nhập email">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-accent hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Đăng nhập</button>
        </form>

        <div class="mt-6 flex items-center before:flex-1 before:border-t before:border-gray-200 after:flex-1 after:border-t after:border-gray-200">
            <span class="px-4 text-xs text-gray-400 uppercase tracking-wider">Hoặc Demo Nhanh</span>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="quickLogin('traveler@tripweave.demo', '123')" class="flex flex-col items-center p-3 border border-gray-200 rounded-xl hover:border-accent hover:bg-blue-50 transition">
                <i class="fa-solid fa-suitcase text-accent mb-1 text-xl"></i>
                <span class="text-xs font-semibold text-gray-700">Du khách</span>
            </button>
            <button onclick="quickLogin('guide@tripweave.demo', '123')" class="flex flex-col items-center p-3 border border-gray-200 rounded-xl hover:border-green-500 hover:bg-green-50 transition">
                <i class="fa-solid fa-map text-green-500 mb-1 text-xl"></i>
                <span class="text-xs font-semibold text-gray-700">HDV</span>
            </button>
            <button onclick="quickLogin('admin@tripweave.demo', '123')" class="flex flex-col items-center p-3 border border-gray-200 rounded-xl hover:border-orange-500 hover:bg-orange-50 transition">
                <i class="fa-solid fa-store text-orange-500 mb-1 text-xl"></i>
                <span class="text-xs font-semibold text-gray-700">Đối tác</span>
            </button>
            <button onclick="quickLogin('admin@tripweave.demo', '123')" class="flex flex-col items-center p-3 border border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition">
                <i class="fa-solid fa-shield text-purple-500 mb-1 text-xl"></i>
                <span class="text-xs font-semibold text-gray-700">Admin</span>
            </button>
        </div>

        <p class="text-center text-sm text-gray-600 mt-8">Chưa có tài khoản? <a href="register.html" class="text-accent hover:underline font-medium">Đăng ký ngay</a></p>
    </div>
</body>
</html>

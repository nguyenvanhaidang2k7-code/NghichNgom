<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn đặt hàng - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', success: '#10B981', warning: '#F97316', background: '#F8FAFC' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body class="bg-background text-gray-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-primary text-white flex flex-col hidden md:flex h-full shrink-0">
        <div class="p-4 flex items-center gap-3 font-bold text-xl border-b border-secondary">
            <i class="fa-solid fa-earth-asia text-accent"></i> TripWeave AI
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav"></nav>
    </aside>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-4"><button class="md:hidden text-gray-500"><i class="fa-solid fa-bars"></i></button></div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer group relative" id="user-menu-btn">
                    <img id="topbar-user-avatar" src="" class="w-9 h-9 rounded-full">
                    <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg hidden z-50" id="user-dropdown">
                        <button onclick="Auth.logout()" class="w-full text-left px-3 py-2 text-sm text-red-600">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6 bg-background relative" id="main-content">
            <div class="max-w-6xl mx-auto">
                <div class="mb-6 flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 mb-1">Quản lý Đơn đặt</h1>
                        <p class="text-sm text-gray-500">Xác nhận và quản lý các đơn đặt trải nghiệm từ du khách.</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                <th class="px-6 py-4 font-medium">Mã đơn</th>
                                <th class="px-6 py-4 font-medium">Khách hàng</th>
                                <th class="px-6 py-4 font-medium">Dịch vụ</th>
                                <th class="px-6 py-4 font-medium">Ngày thực hiện</th>
                                <th class="px-6 py-4 font-medium">Trạng thái</th>
                                <th class="px-6 py-4 font-medium">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 font-mono text-gray-500">#ORD-9821</td>
                                <td class="px-6 py-4 font-medium text-gray-900">Lê Văn C</td>
                                <td class="px-6 py-4 text-gray-700">Du thuyền Hạ Long 2N1Đ</td>
                                <td class="px-6 py-4 text-gray-600">15/10/2026</td>
                                <td class="px-6 py-4"><span class="px-2.5 py-1 bg-orange-50 text-warning text-xs font-semibold rounded-full border border-orange-100">Chờ xác nhận</span></td>
                                <td class="px-6 py-4">
                                    <div class="flex gap-2">
                                        <button class="px-2 py-1 bg-accent text-white rounded hover:bg-blue-700 text-xs font-medium">Xác nhận</button>
                                        <button class="px-2 py-1 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 text-xs font-medium">Hủy</button>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 font-mono text-gray-500">#ORD-9820</td>
                                <td class="px-6 py-4 font-medium text-gray-900">Trần Thị D</td>
                                <td class="px-6 py-4 text-gray-700">Vé thăm quan Vịnh Hạ Long</td>
                                <td class="px-6 py-4 text-gray-600">12/10/2026</td>
                                <td class="px-6 py-4"><span class="px-2.5 py-1 bg-green-50 text-success text-xs font-semibold rounded-full border border-green-100">Đã xác nhận</span></td>
                                <td class="px-6 py-4">
                                    <button class="px-2 py-1 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 text-xs font-medium">Chi tiết</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

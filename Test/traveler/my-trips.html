<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyến đi của tôi - TripWeave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0F172A', secondary: '#1E293B', accent: '#2563EB', success: '#10B981', warning: '#F97316', danger: '#EF4444', background: '#F8FAFC' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body class="bg-background text-gray-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-primary text-white flex flex-col hidden md:flex h-full shrink-0">
        <div class="p-4 flex items-center gap-3 font-bold text-xl border-b border-secondary">
            <i class="fa-solid fa-earth-asia text-accent"></i> TripWeave AI
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav"></nav>
    </aside>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-4"><button class="md:hidden text-gray-500"><i class="fa-solid fa-bars"></i></button></div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 cursor-pointer group relative" id="user-menu-btn">
                    <img id="topbar-user-avatar" src="" class="w-9 h-9 rounded-full">
                    <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg hidden z-50" id="user-dropdown">
                        <button onclick="Auth.logout()" class="w-full text-left px-3 py-2 text-sm text-red-600">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6 bg-background relative" id="main-content">
            <div class="max-w-6xl mx-auto space-y-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Chuyến đi của tôi</h1>
                        <p class="text-gray-500 text-sm">Quản lý các lịch trình du lịch bạn đã tạo và trạng thái phê duyệt.</p>
                    </div>
                    <a href="trip-planner.html" class="bg-accent hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Tạo chuyến đi mới
                    </a>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="my-trips-grid">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (!user) return;
            const db = MockDB.get();
            const myTrips = db.trips.filter(t => t.userId === user.id);
            const grid = document.getElementById('my-trips-grid');
            
            if (myTrips.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">Bạn chưa tạo chuyến đi nào.</div>';
                return;
            }

            myTrips.forEach(trip => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition';
                
                let badgeClass = 'bg-orange-50 text-warning border-orange-100';
                let badgeText = 'Chờ review';
                let icon = 'fa-clock';
                if(trip.status === 'approved') { badgeClass = 'bg-green-50 text-success border-green-100'; badgeText = 'Đã duyệt'; icon = 'fa-check'; }
                if(trip.status === 'rejected') { badgeClass = 'bg-red-50 text-danger border-red-100'; badgeText = 'Từ chối'; icon = 'fa-xmark'; }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full border flex items-center gap-1 ${badgeClass}"><i class="fa-solid ${icon}"></i> ${badgeText}</span>
                        <span class="text-xs text-gray-400">${trip.createdAt.split('T')[0]}</span>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg mb-2">${trip.title}</h3>
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <p><i class="fa-regular fa-calendar w-5 text-gray-400"></i> ${trip.days} Ngày</p>
                        <p><i class="fa-solid fa-wallet w-5 text-gray-400"></i> ${trip.budget}</p>
                    </div>
                    ${trip.guideFeedback ? `<div class="text-xs bg-gray-50 p-2 rounded text-gray-600 mb-3 border border-gray-200"><strong>HDV:</strong> ${trip.guideFeedback}</div>` : ''}
                    <button class="w-full text-center py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">Chi tiết</button>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Không tìm thấy trang | TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute top-10 left-10 w-72 h-72 rounded-full bg-emerald-500/10 blur-2xl"></div>
  <div class="absolute bottom-10 right-10 w-80 h-80 rounded-full bg-violet-500/10 blur-2xl"></div>
  <div class="relative text-center fade-up">
    <span class="inline-flex w-20 h-20 rounded-3xl bg-amber-500 text-white items-center justify-center text-4xl shadow-xl"><i class="fa-solid fa-compass"></i></span>
    <p class="mt-6 text-7xl font-black text-white tracking-tight">404</p>
    <h1 class="mt-2 text-xl font-bold text-white">Không tìm thấy trang</h1>
    <p class="mt-2 text-sm text-slate-400 max-w-md mx-auto">Tuyến đường bạn đang tìm không tồn tại trên bản đồ TripWeave AI. Có thể liên kết đã bị gỡ bỏ hoặc địa chỉ không đúng.</p>
    <div class="mt-6 flex items-center justify-center gap-3 flex-wrap">
      <a id="home-link" href="login.html" class="px-5 py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow-lg transition"><i class="fa-solid fa-house mr-1.5"></i>Return to Dashboard</a>
      <a href="login.html" class="px-5 py-2.5 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 text-sm font-medium transition"><i class="fa-solid fa-right-to-bracket mr-1.5"></i>Trang đăng nhập</a>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const user = twCurrentUser();
      if (user && TW_ROLE_META[user.role]) document.getElementById('home-link').href = twRoleHome(user.role);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu – TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-100 via-white to-amber-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 fade-up">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500 text-white flex items-center justify-center text-2xl shadow-lg"><i class="fa-solid fa-key"></i></div>
    <h1 class="mt-4 text-2xl font-bold text-slate-900 text-center">Quên mật khẩu</h1>
    <p class="mt-2 text-sm text-slate-500 text-center">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu cho bạn.</p>
    <form id="forgot-form" class="mt-6 space-y-4" novalidate>
      <div>
        <label for="forgot-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="forgot-email" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100 transition" placeholder="ban@tripweave.ai">
        <p id="forgot-email-error" class="mt-1 text-xs text-red-500 hidden"></p>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 shadow-md transition"><i class="fa-solid fa-paper-plane mr-1.5"></i>Gửi liên kết đặt lại</button>
      <div id="forgot-success" class="hidden rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-700">
        <i class="fa-solid fa-circle-check mr-1"></i>Liên kết đặt lại mật khẩu đã được gửi tới <span id="forgot-success-email" class="font-semibold"></span>. Vui lòng kiểm tra hộp thư (demo).
      </div>
      <p class="text-center text-sm text-slate-600"><a href="login.html" class="text-amber-600 font-medium hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>Quay lại đăng nhập</a></p>
    </form>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const form = document.getElementById('forgot-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        const err = document.getElementById('forgot-email-error');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          err.textContent = 'Email không hợp lệ.';
          err.classList.remove('hidden');
          return;
        }
        err.classList.add('hidden');
        document.getElementById('forgot-success-email').textContent = email;
        document.getElementById('forgot-success').classList.remove('hidden');
        showToast('Đã gửi liên kết đặt lại mật khẩu tới ' + email);
      });
    })();
  </script>
</body>
</html>

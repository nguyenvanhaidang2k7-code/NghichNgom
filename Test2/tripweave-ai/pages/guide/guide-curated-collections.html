<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ sưu tập – TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body class="bg-slate-50 min-h-screen" data-role="guide" data-page="guide-curated-collections">
  <div id="sidebar-overlay"></div>
  <aside id="app-sidebar"></aside>
  <div class="md:pl-64 flex flex-col min-h-screen">
    <header id="app-topbar"></header>
    <main class="flex-1 p-4 md:p-6 space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3 fade-up">
        <div>
          <h1 class="text-2xl font-bold text-slate-900"><i class="fa-solid fa-bookmark text-emerald-500 mr-2"></i>Bộ sưu tập đã tuyển chọn</h1>
          <p class="text-sm text-slate-500 mt-0.5">Tạo bộ sưu tập địa điểm theo chủ đề để chia sẻ với du khách.</p>
        </div>
        <button type="button" id="btn-new-col" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow-md transition"><i class="fa-solid fa-plus mr-1.5"></i>Tạo bộ sưu tập</button>
      </div>
      <div id="collections-grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      <p id="collections-empty" class="hidden text-center text-sm text-slate-400 py-12"><i class="fa-regular fa-folder-open mr-1"></i>Chưa có bộ sưu tập nào. Nhấn "Tạo bộ sưu tập" để bắt đầu tuyển chọn.</p>
    </main>
    <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">TripWeave AI • BTL-07 • CSE122 – Phát triển ứng dụng web cơ bản</footer>
  </div>
  <!-- Modal: form bộ sưu tập -->
  <div id="modal-col" class="tw-modal" hidden>
    <div class="tw-modal-backdrop" data-close-modal="modal-col"></div>
    <div class="tw-modal-panel w-full max-w-xl bg-white rounded-2xl shadow-2xl">
      <div class="flex items-center justify-between p-5 border-b border-slate-100">
        <h3 id="col-modal-title" class="font-bold text-slate-900 text-lg"><i class="fa-solid fa-bookmark text-emerald-500 mr-2"></i>Tạo bộ sưu tập</h3>
        <button type="button" data-close-modal="modal-col" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="col-form" class="p-5 space-y-4">
        <input type="hidden" id="cf-id">
        <div>
          <label for="cf-title" class="block text-sm font-medium text-slate-700 mb-1">Tên bộ sưu tập</label>
          <input type="text" id="cf-title" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="VD: Ẩm thực đường phố Hà Nội">
        </div>
        <div>
          <label for="cf-desc" class="block text-sm font-medium text-slate-700 mb-1">Mô tả ngắn</label>
          <input type="text" id="cf-desc" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Chủ đề, gợi ý sử dụng...">
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-slate-700">Chọn địa điểm <span id="cf-count" class="text-xs text-emerald-600 font-bold">(0)</span></span>
            <input type="text" id="cf-search" class="border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-emerald-400 w-40 transition" placeholder="Lọc địa điểm...">
          </div>
          <div id="cf-places" class="space-y-1.5 max-h-64 overflow-y-auto pr-1 border border-slate-100 rounded-xl p-2"></div>
        </div>
        <div class="flex gap-2">
          <button type="button" data-close-modal="modal-col" class="flex-1 py-2.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Hủy</button>
          <button type="submit" class="flex-1 py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow transition"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Lưu bộ sưu tập</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal: xác nhận xóa -->
  <div id="modal-delete-col" class="tw-modal" hidden>
    <div class="tw-modal-backdrop" data-close-modal="modal-delete-col"></div>
    <div class="tw-modal-panel w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6 text-center">
      <span class="w-14 h-14 mx-auto rounded-2xl bg-red-100 text-red-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></span>
      <h3 class="mt-4 font-bold text-slate-900 text-lg">Xóa bộ sưu tập?</h3>
      <p id="delete-col-name" class="mt-1 text-sm text-slate-500"></p>
      <div class="mt-5 flex gap-2">
        <button type="button" data-close-modal="modal-delete-col" class="flex-1 py-2.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Hủy</button>
        <button type="button" id="confirm-delete-col" class="flex-1 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-semibold shadow transition"><i class="fa-solid fa-trash-can mr-1.5"></i>Xóa</button>
      </div>
    </div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/main.js"></script>
  <script src="guide.js"></script>
</body>
</html>

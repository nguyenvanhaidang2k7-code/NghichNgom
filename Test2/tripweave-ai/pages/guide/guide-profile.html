<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ HDV – TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body class="bg-slate-50 min-h-screen" data-role="guide" data-page="guide-profile">
  <div id="sidebar-overlay"></div>
  <aside id="app-sidebar"></aside>
  <div class="md:pl-64 flex flex-col min-h-screen">
    <header id="app-topbar"></header>
    <main class="flex-1 p-4 md:p-6 space-y-6">
      <!-- Profile header -->
      <section class="bg-white rounded-2xl border border-slate-200 p-6 fade-up">
        <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
          <span id="pf-initials" class="w-20 h-20 rounded-2xl bg-emerald-500 text-white text-2xl font-bold flex items-center justify-center shadow-lg shrink-0"></span>
          <div class="flex-1 text-center sm:text-left">
            <div class="flex items-center justify-center sm:justify-start gap-2 flex-wrap">
              <h1 id="pf-name" class="text-2xl font-bold text-slate-900"></h1>
              <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Đã xác minh</span>
            </div>
            <p id="pf-title" class="text-sm text-slate-500 mt-1"></p>
            <div class="mt-2 flex items-center justify-center sm:justify-start gap-3 text-sm text-slate-600">
              <span id="pf-stars"></span>
              <span class="font-bold" id="pf-rating"></span>
              <span class="text-slate-300">|</span>
              <span><i class="fa-solid fa-eye text-blue-400 mr-1"></i><b id="pf-views">0</b> lượt xem</span>
            </div>
            <p id="pf-bio" class="mt-3 text-sm text-slate-600 max-w-2xl"></p>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center shrink-0">
            <div class="bg-slate-50 rounded-xl px-4 py-3"><p class="font-bold text-slate-800 text-lg" id="pf-tours">0</p><p class="text-[11px] text-slate-400">Tours</p></div>
            <div class="bg-slate-50 rounded-xl px-4 py-3"><p class="font-bold text-slate-800 text-lg" id="pf-exp">–</p><p class="text-[11px] text-slate-400">Kinh nghiệm</p></div>
            <div class="bg-slate-50 rounded-xl px-4 py-3"><p class="font-bold text-slate-800 text-lg" id="pf-reviews">0</p><p class="text-[11px] text-slate-400">Đánh giá</p></div>
          </div>
        </div>
        <div id="pf-tags" class="mt-4 flex flex-wrap gap-1.5 justify-center sm:justify-start"></div>
      </section>
      <div class="grid lg:grid-cols-2 gap-5 items-start">
        <!-- Edit form -->
        <section class="bg-white rounded-2xl border border-slate-200 p-5 fade-up">
          <h2 class="font-bold text-slate-900 mb-4"><i class="fa-solid fa-user-pen text-emerald-500 mr-2"></i>Chỉnh sửa hồ sơ</h2>
          <form id="profile-form" class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label for="pf-in-name" class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                <input type="text" id="pf-in-name" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition">
              </div>
              <div>
                <label for="pf-in-title" class="block text-sm font-medium text-slate-700 mb-1">Chức danh</label>
                <input type="text" id="pf-in-title" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Hướng dẫn viên • Hà Nội">
              </div>
              <div>
                <label for="pf-in-specialties" class="block text-sm font-medium text-slate-700 mb-1">Chuyên môn</label>
                <input type="text" id="pf-in-specialties" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Văn hóa, Ẩm thực">
              </div>
              <div>
                <label for="pf-in-regions" class="block text-sm font-medium text-slate-700 mb-1">Khu vực hoạt động</label>
                <input type="text" id="pf-in-regions" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Hà Nội & miền Bắc">
              </div>
              <div>
                <label for="pf-in-experience" class="block text-sm font-medium text-slate-700 mb-1">Kinh nghiệm</label>
                <input type="text" id="pf-in-experience" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="5 năm">
              </div>
              <div>
                <label for="pf-in-languages" class="block text-sm font-medium text-slate-700 mb-1">Ngôn ngữ</label>
                <input type="text" id="pf-in-languages" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Việt, Anh">
              </div>
            </div>
            <div>
              <label for="pf-in-bio" class="block text-sm font-medium text-slate-700 mb-1">Giới thiệu bản thân</label>
              <textarea id="pf-in-bio" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow transition"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Lưu thay đổi</button>
          </form>
        </section>
        <div class="space-y-5">
          <!-- Reviews -->
          <section class="bg-white rounded-2xl border border-slate-200 p-5 fade-up">
            <h2 class="font-bold text-slate-900 mb-4"><i class="fa-regular fa-star text-amber-500 mr-2"></i>Đánh giá từ du khách</h2>
            <div id="pf-review-list" class="space-y-3"></div>
          </section>
          <!-- Articles -->
          <section class="bg-white rounded-2xl border border-slate-200 p-5 fade-up">
            <h2 class="font-bold text-slate-900 mb-4"><i class="fa-solid fa-newspaper text-violet-500 mr-2"></i>Bài viết của tôi</h2>
            <div id="pf-post-list" class="space-y-2.5"></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">TripWeave AI • BTL-07 • CSE122 – Phát triển ứng dụng web cơ bản</footer>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/main.js"></script>
  <script src="guide.js"></script>
</body>
</html>

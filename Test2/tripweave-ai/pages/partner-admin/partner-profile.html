<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ đối tác – TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="partner-admin.css">
</head>
<body class="bg-slate-50 min-h-screen" data-role="partner" data-page="partner-profile">
  <div id="sidebar-overlay"></div>
  <aside id="app-sidebar"></aside>
  <div class="md:pl-64 flex flex-col min-h-screen">
    <header id="app-topbar"></header>
    <main class="flex-1 p-4 md:p-6 space-y-6">
      <!-- Profile header -->
      <section class="bg-white rounded-2xl border border-slate-200 p-6 fade-up">
        <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
          <span id="pp-initials" class="w-20 h-20 rounded-2xl bg-violet-500 text-white text-2xl font-bold flex items-center justify-center shadow-lg shrink-0"></span>
          <div class="flex-1 text-center sm:text-left">
            <div class="flex items-center justify-center sm:justify-start gap-2 flex-wrap">
              <h1 id="pp-company" class="text-2xl font-bold text-slate-900"></h1>
              <span id="pp-verified" class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Đối tác xác minh</span>
            </div>
            <p id="pp-address" class="text-sm text-slate-500 mt-1"></p>
            <div class="mt-2 flex items-center justify-center sm:justify-start gap-3 text-sm text-slate-600 flex-wrap">
              <span id="pp-stars"></span><span class="font-bold" id="pp-rating"></span>
              <span class="text-slate-300">|</span>
              <span><i class="fa-regular fa-comment text-violet-400 mr-1"></i><b id="pp-reviews">0</b> đánh giá</span>
              <span class="text-slate-300">|</span>
              <span><i class="fa-solid fa-layer-group text-emerald-400 mr-1"></i><b id="pp-services">0</b> dịch vụ</span>
            </div>
            <p id="pp-desc" class="mt-3 text-sm text-slate-600 max-w-2xl"></p>
          </div>
        </div>
        <div id="pp-contact" class="mt-4 grid sm:grid-cols-3 gap-2 text-sm"></div>
      </section>
      <div class="grid lg:grid-cols-2 gap-5 items-start">
        <!-- Edit form -->
        <section class="bg-white rounded-2xl border border-slate-200 p-5 fade-up">
          <h2 class="font-bold text-slate-900 mb-4"><i class="fa-solid fa-building-circle-check text-violet-500 mr-2"></i>Thông tin doanh nghiệp</h2>
          <form id="pp-form" class="space-y-4">
            <div>
              <label for="pp-in-company" class="block text-sm font-medium text-slate-700 mb-1">Tên công ty</label>
              <input type="text" id="pp-in-company" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition">
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label for="pp-in-address" class="block text-sm font-medium text-slate-700 mb-1">Địa chỉ</label>
                <input type="text" id="pp-in-address" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition">
              </div>
              <div>
                <label for="pp-in-phone" class="block text-sm font-medium text-slate-700 mb-1">Số điện thoại</label>
                <input type="text" id="pp-in-phone" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition">
              </div>
              <div>
                <label for="pp-in-email" class="block text-sm font-medium text-slate-700 mb-1">Email liên hệ</label>
                <input type="email" id="pp-in-email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition">
              </div>
              <div>
                <label for="pp-in-hours" class="block text-sm font-medium text-slate-700 mb-1">Giờ làm việc</label>
                <input type="text" id="pp-in-hours" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition" placeholder="08:00–18:00">
              </div>
            </div>
            <div>
              <label for="pp-in-desc" class="block text-sm font-medium text-slate-700 mb-1">Giới thiệu</label>
              <textarea id="pp-in-desc" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100 transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-lg bg-violet-500 hover:bg-violet-600 text-white text-sm font-semibold shadow transition"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Lưu thông tin</button>
          </form>
        </section>
        <!-- Services -->
        <section class="bg-white rounded-2xl border border-slate-200 p-5 fade-up">
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-bold text-slate-900"><i class="fa-solid fa-store text-violet-500 mr-2"></i>Dịch vụ đang cung cấp</h2>
            <a href="partner-activity-management.html" class="text-sm font-semibold text-violet-600 hover:underline">Quản lý <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></a>
          </div>
          <div id="pp-service-list" class="space-y-2.5"></div>
        </section>
      </div>
    </main>
    <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">TripWeave AI • BTL-07 • CSE122 – Phát triển ứng dụng web cơ bản</footer>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/main.js"></script>
  <script src="partner-admin.js"></script>
</body>
</html>

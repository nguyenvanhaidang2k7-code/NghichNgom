<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký – TripWeave AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-100 via-white to-violet-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 p-8 fade-up">
    <div class="flex items-center gap-2.5 justify-center">
      <span class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-lg"><i class="fa-solid fa-route"></i></span>
      <span class="font-bold text-xl text-slate-900">TripWeave <span class="text-emerald-500">AI</span></span>
    </div>
    <h1 class="mt-4 text-2xl font-bold text-slate-900 text-center">Tạo tài khoản mới</h1>
    <p class="mt-1 text-sm text-slate-500 text-center">Tham gia cộng đồng du lịch thông minh cùng TripWeave AI.</p>
    <form id="register-form" class="mt-6 space-y-4" novalidate>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label for="reg-name" class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
          <input type="text" id="reg-name" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Nguyễn Văn A">
          <p id="reg-name-error" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>
        <div>
          <label for="reg-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="reg-email" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="ban@tripweave.ai">
          <p id="reg-email-error" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label for="reg-password" class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
          <input type="password" id="reg-password" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="Tối thiểu 6 ký tự">
          <p id="reg-password-error" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>
        <div>
          <label for="reg-confirm" class="block text-sm font-medium text-slate-700 mb-1">Nhập lại mật khẩu</label>
          <input type="password" id="reg-confirm" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" placeholder="••••••">
          <p id="reg-confirm-error" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>
      </div>
      <div>
        <span class="block text-sm font-medium text-slate-700 mb-2">Vai trò của bạn</span>
        <div class="grid grid-cols-2 gap-2" id="role-selector">
          <label class="cursor-pointer flex items-center gap-2 px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:text-blue-700"><input type="radio" name="role" value="traveler" checked class="accent-blue-600"><i class="fa-solid fa-compass"></i>Du khách</label>
          <label class="cursor-pointer flex items-center gap-2 px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 transition has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 has-[:checked]:text-emerald-700"><input type="radio" name="role" value="guide" class="accent-emerald-600"><i class="fa-solid fa-person-hiking"></i>Hướng dẫn viên</label>
          <label class="cursor-pointer flex items-center gap-2 px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 transition has-[:checked]:border-violet-500 has-[:checked]:bg-violet-50 has-[:checked]:text-violet-700"><input type="radio" name="role" value="partner" class="accent-violet-600"><i class="fa-solid fa-handshake"></i>Đối tác</label>
          <label class="cursor-pointer flex items-center gap-2 px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50 has-[:checked]:text-amber-700"><input type="radio" name="role" value="admin" class="accent-amber-500"><i class="fa-solid fa-shield-halved"></i>Quản trị</label>
        </div>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 shadow-md transition"><i class="fa-solid fa-user-plus mr-1.5"></i>Đăng ký tài khoản</button>
      <p class="text-center text-sm text-slate-600">Đã có tài khoản? <a href="login.html" class="text-emerald-600 font-medium hover:underline">Đăng nhập</a></p>
    </form>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const form = document.getElementById('register-form');
      function setError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.toggle('hidden', !msg);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        const role = form.querySelector('input[name="role"]:checked').value;
        let ok = true;
        ['reg-name-error', 'reg-email-error', 'reg-password-error', 'reg-confirm-error'].forEach(function (id) { setError(id, ''); });
        if (name.length < 2) { setError('reg-name-error', 'Vui lòng nhập họ tên hợp lệ.'); ok = false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('reg-email-error', 'Email không hợp lệ.'); ok = false; }
        if (password.length < 6) { setError('reg-password-error', 'Mật khẩu tối thiểu 6 ký tự.'); ok = false; }
        if (confirm !== password) { setError('reg-confirm-error', 'Mật khẩu nhập lại không khớp.'); ok = false; }
        if (!ok) return;
        const users = twGet(TW_KEYS.users, []);
        if (users.some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); })) {
          setError('reg-email-error', 'Email đã được sử dụng.');
          showToast('Email đã tồn tại trong hệ thống!', 'error');
          return;
        }
        users.push({ id: twUid('u'), name: name, email: email, password: password, role: role });
        twSet(TW_KEYS.users, users);
        showToast('Đăng ký thành công! Đang chuyển tới trang đăng nhập...');
        setTimeout(function () { location.href = 'login.html'; }, 1200);
      });
    })();
  </script>
</body>
</html>

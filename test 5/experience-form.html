<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin trải nghiệm | TripWeave AI</title><link rel="stylesheet" href="assets/css/common.css"><link rel="stylesheet" href="assets/css/partner.css">
</head>
<body data-role="partner" data-page="experience-form">
  <div data-page-content>
    <section class="card card-pad">
      <h1 class="card-title">Thông tin trải nghiệm</h1>
      <form id="experience-form">
        <div class="form-grid">
          <label class="field">Tên trải nghiệm<input class="input" required value="Du thuyền ngắm vịnh"></label>
          <label class="field">Loại<select class="select"><option>Nghỉ dưỡng</option><option>Tour</option><option>Homestay</option></select></label>
          <label class="field">Giá<input class="input" value="1.200.000đ/người"></label>
          <label class="field">Sức chứa<input class="input" value="20 người"></label>
          <label class="field span-two">Mô tả<textarea class="textarea" rows="2">Trải nghiệm ngắm cảnh và dùng bữa trên du thuyền...</textarea></label>
          <label class="field">Ngày hoạt động<input class="input" value="Thứ 2 – Chủ nhật"></label>
          <label class="field">Khung giờ<input class="input" value="08:00 – 18:00"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Lưu trải nghiệm</button></div>
      </form>
    </section>
  </div>
  <script src="assets/js/app.js"></script><script src="assets/js/partner.js"></script>
</body>
</html>

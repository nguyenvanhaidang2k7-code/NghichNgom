<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | TripWeave AI</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="login-page">
  <main class="login-card">
    <section class="login-brand" aria-label="TripWeave AI">
      <div class="travel-art" aria-hidden="true">
        <span class="travel-bag"><span class="travel-landscape"></span><span class="travel-pin">⌖</span></span>
        <span class="travel-plane">✈</span>
      </div>
      <p class="login-logo">TripWeaveAI</p>
    </section>
    <section class="login-form-wrap">
      <h1>Đăng nhập</h1>
      <form id="login-form" class="login-form">
        <label class="field" for="email">Email
          <input class="input" id="email" type="email" value="admin@tripweave.demo" autocomplete="username" required>
        </label>
        <label class="field" for="password">Mật khẩu
          <input class="input" id="password" type="password" value="123456" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">Đăng nhập</button>
      </form>
      <a class="forgot-link" href="#">Quên mật khẩu?</a>
      <p class="login-help">Bản demo · Email và mật khẩu có thể nhập bất kỳ giá trị nào.</p>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/js/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doanh thu | TripWeave AI</title><link rel="stylesheet" href="assets/css/common.css"><link rel="stylesheet" href="assets/css/partner.css">
</head>
<body data-role="partner" data-page="revenue">
  <div data-page-content>
    <section class="stats-grid">
      <article class="card stat-card"><div class="stat-label">Doanh thu tháng</div><div class="stat-value">45.000.000đ</div></article>
      <article class="card stat-card"><div class="stat-label">Đơn hoàn thành</div><div class="stat-value green">128</div></article>
      <article class="card stat-card"><div class="stat-label">Đánh giá TB</div><div class="stat-value orange">4.7 ★</div></article>
    </section>
    <div class="revenue-layout">
      <section class="card card-pad">
        <h1 class="card-title">Doanh thu theo tháng</h1>
        <div id="revenue-chart" aria-label="Biểu đồ doanh thu 6 tháng"></div>
      </section>
      <div class="revenue-side">
        <section class="card card-pad growth-card">
          <h2 class="card-title">Tăng trưởng</h2><div class="growth-number">+12%</div>
          <p class="row-subtitle">so với tháng trước</p>
        </section>
        <section class="card card-pad">
          <h2 class="card-title">Top dịch vụ</h2>
          <div class="row-subtitle">Du thuyền · 62%<br>Homestay · 24%</div>
        </section>
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script><script src="assets/js/partner.js"></script>
</body>
</html>
